input{width:100%;padding:12px;border:1px solid #d5dae1;border-radius:10px;font-size:16px}
.rodape{display:flex;gap:10px;margin-top:14px}

 Agro","Limpeza e Utilidades","Mangueiras e Acoplamentos","Medição e Teste","Movimentação de Cargas","Papelaria e Informática","Peças e Partes de Máquinas","Pintura","Pneumática e Ar Comprimido","Sinalização","Solda e Gás","Vedação e Borrachas"],"pasta":"/revisor-categorias/fotos/"};
var CH = 'caborge_fotos_v1';
var resp = JSON.parse(localStorage.getItem(CH) || '{"vendedor":"","r":{},"feitas":{}}');
if(!resp.r) resp.r = {};
if(!resp.feitas) resp.feitas = {};
var catAtual = null, i = 0;

function salvar(){ localStorage.setItem(CH, JSON.stringify(resp)); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function daCat(c){ return DADOS.produtos.filter(function(p){ return p.C === c; }); }
function feitos(c){ return daCat(c).filter(function(p){ return resp.r[p.N]; }).length; }

function baixar(){
  var sim = 0, nao = 0;
  for(var k in resp.r){ if(resp.r[k] === 'SIM') sim++; else nao++; }
  var out = { vendedor: resp.vendedor || '', data: new Date().toISOString().slice(0,16).replace('T',' '),
              total_respondidas: sim + nao, foto_ok: sim, foto_errada: nao,
              respostas: resp.r };
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type:'application/json'}));
  a.download = 'fotos_' + (resp.vendedor || 'vendedor').replace(/[^A-Za-z0-9]/g,'_') + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  localStorage.setItem(CH + '_baixou', '1');
}

function render(){
  var app = document.getElementById('app');
  document.getElementById('quem').textContent = resp.vendedor ? '· ' + resp.vendedor : '';
  if(!resp.vendedor){ telaNome(app); return; }
  if(catAtual === null){ telaLista(app); return; }
  telaItem(app);
}

function telaNome(app){
  app.innerHTML = '<div class="cx"><h2>Conferencia de fotos</h2>' +
    '<div class="sub">Voce vai ver a foto, o codigo e o nome de cada produto. ' +
    'So responda: <b>a foto e desse produto mesmo?</b></div>' +
    '<div class="card" style="text-align:left">' +
    '<div style="margin-bottom:8px;font-weight:600">Seu nome</div>' +
    '<input id="nm" placeholder="Ex: Vincente" autocomplete="name">' +
    '<button class="bt azul" style="width:100%;margin-top:12px" onclick="entrar()">Comecar</button>' +
    '</div>' +
    '<div class="aviso">Da para parar e voltar depois: o celular guarda o que voce ja marcou. ' +
    'No fim, clique em <b>Baixar respostas</b> e mande o arquivo para o Anderson.</div></div>';
}
function entrar(){
  var v = (document.getElementById('nm').value || '').trim();
  if(!v){ alert('Escreva seu nome.'); return; }
  resp.vendedor = v; salvar(); render();
}

function telaLista(app){
  var tot = DADOS.produtos.length, ok = Object.keys(resp.r).length;
  var h = '<div class="cx"><h2>Escolha uma categoria</h2>' +
    '<div class="sub">Pegue uma que voce conhece. Cada vendedor faz categorias ' +
    'diferentes para nao repetir trabalho.</div>' +
    '<div class="barra"><i style="width:' + (tot ? ok*100/tot : 0) + '%"></i></div>' +
    '<div class="linha"><span>' + ok + ' de ' + tot + ' fotos conferidas</span>' +
    '<span>' + Math.round(tot ? ok*100/tot : 0) + '%</span></div>' +
    '<div class="grade" style="margin-top:14px">';
  DADOS.categorias.forEach(function(c){
    var n = daCat(c).length, f = feitos(c);
    h += '<button class="cat' + (f >= n ? ' pronta' : '') + '" onclick="abrir(' +
         JSON.stringify(c).replace(/"/g,'&quot;') + ')">' +
         '<b>' + esc(c) + '</b><span>' + f + ' de ' + n +
         (f >= n ? ' · pronta' : '') + '</span></button>';
  });
  h += '</div>';
  if(ok) h += '<div class="ok">Ja tem resposta para ' + ok + ' fotos. ' +
              'Clique em <b>Baixar respostas</b> la em cima quando quiser mandar.</div>';
  app.innerHTML = h + '</div>';
}

function abrir(c){
  catAtual = c;
  var lista = daCat(c);
  i = 0;
  for(var k = 0; k < lista.length; k++){ if(!resp.r[lista[k].N]){ i = k; break; } }
  window.scrollTo(0,0); render();
}

function telaItem(app){
  var lista = daCat(catAtual);
  if(i >= lista.length){
    app.innerHTML = '<div class="cx"><h2>' + esc(catAtual) + ' — terminou</h2>' +
      '<div class="ok">Voce conferiu as ' + lista.length + ' fotos desta categoria.</div>' +
      '<div class="rodape"><button class="bt cinza" onclick="voltar()">Escolher outra</button>' +
      '<button class="bt azul" onclick="baixar()">Baixar respostas</button></div></div>';
    return;
  }
  var p = lista[i], marcada = resp.r[p.N];
  var f = feitos(catAtual);
  app.innerHTML = '<div class="cx">' +
    '<div class="linha"><span>' + esc(catAtual) + '</span>' +
    '<span>' + (i+1) + ' de ' + lista.length + '</span></div>' +
    '<div class="barra"><i style="width:' + (f*100/lista.length) + '%"></i></div>' +
    '<div class="card">' +
    '<img class="foto" src="' + DADOS.pasta + p.F + '" alt="" loading="eager">' +
    '<div class="cod">' + esc(p.K) + '</div>' +
    '<div class="nome">' + esc(p.N) + '</div>' +
    '<div class="cat-do-item">' + esc(p.C) + '</div>' +
    '<div class="acoes">' +
      '<button class="gg nao" onclick="marcar(\'NAO\')">NAO e' +
        (marcada === 'NAO' ? ' ✓' : '') + '</button>' +
      '<button class="gg sim" onclick="marcar(\'SIM\')">SIM, e' +
        (marcada === 'SIM' ? ' ✓' : '') + '</button>' +
    '</div></div>' +
    '<div class="rodape">' +
      '<button class="bt cinza" onclick="anterior()">&larr; Voltar</button>' +
      '<button class="bt cinza" onclick="pular()">Pular</button>' +
      '<button class="bt cinza" onclick="voltar()">Categorias</button>' +
    '</div></div>';
}

function marcar(v){
  var lista = daCat(catAtual);
  resp.r[lista[i].N] = v;
  salvar();
  i++; window.scrollTo(0,0); render();
}
function pular(){ i++; window.scrollTo(0,0); render(); }
function anterior(){ if(i > 0) i--; window.scrollTo(0,0); render(); }
function voltar(){ catAtual = null; window.scrollTo(0,0); render(); }

window.onbeforeunload = function(){
  if(Object.keys(resp.r).length && !localStorage.getItem(CH + '_baixou'))
    return 'Voce tem respostas nao baixadas.';
};
render();
</script>
