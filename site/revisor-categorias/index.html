var CH = 'caborge_categorias_web';
var resp = JSON.parse(localStorage.getItem(CH) || '{"revisor":"","categorias":{},"revisadas":{},"pendVistos":{}}');
if(!resp.categorias) resp.categorias = {};
if(!resp.revisadas) resp.revisadas = {};
if(!resp.pendVistos) resp.pendVistos = {};
var catAtual = '', marcados = {};
var porNome = {};
DADOS.produtos.forEach(function(p){ porNome[p.NOME] = p; });

function salvar(){ localStorage.setItem(CH, JSON.stringify(resp)); }
function catDe(p){ return resp.categorias[p.NOME] || p.CATEGORIA; }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function arg(t){ return esc(JSON.stringify(t)); }

function contagem(){
  var c = {};
  DADOS.categorias.forEach(function(k){ c[k] = 0; });
  DADOS.produtos.forEach(function(p){ var k = catDe(p); c[k] = (c[k]||0) + 1; });
  return c;
}
function nMudancas(){ return Object.keys(resp.categorias).length; }
function nRevisadas(){ return Object.keys(resp.revisadas).length; }

function baixar(){
  var d = {revisor: resp.revisor, data: new Date().toISOString().slice(0,16).replace('T',' '),
           categorias: resp.categorias, revisadas: Object.keys(resp.revisadas),
           pendenciasVistas: Object.keys(resp.pendVistos)};
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 1)], {type:'application/json'}));
  a.download = 'categorias_' + (resp.revisor || 'revisor').replace(/[^a-zA-Z0-9]/g,'_') + '.json';
  a.click();
}

function entrar(){
  var v = (document.getElementById('nome').value || '').trim();
  if(v.length < 2){ alert('Digite seu nome para comecarmos.'); return; }
  resp.revisor = v; salvar(); render();
}
function abrirCat(c){ catAtual = c; marcados = {}; window.scrollTo(0,0); render(); }
function voltar(){ catAtual = ''; marcados = {}; window.scrollTo(0,0); render(); }
function limpar(){ marcados = {}; render(); }
function marcar(nome){ if(marcados[nome]){ delete marcados[nome]; } else { marcados[nome] = 1; } render(); }

function aplicar(){
  var sel = document.getElementById('destino'), destino = sel.value;
  if(destino === '__NOVA__'){
    var t = document.getElementById('nova');
    destino = t ? (t.value || '').trim() : '';
    if(!destino){ alert('Digite o nome da categoria nova.'); return; }
    if(DADOS.categorias.indexOf(destino) < 0) DADOS.categorias.push(destino);
  }
  Object.keys(marcados).forEach(function(n){ resp.categorias[n] = destino; });
  marcados = {}; salvar(); render();
}
function catOk(){ resp.revisadas[catAtual] = 1; catAtual = ''; salvar(); window.scrollTo(0,0); render(); }
function desfazer(nome){ delete resp.categorias[nome]; salvar(); render(); }

function render(){
  var app = document.getElementById('app');
  var topo = document.getElementById('acoesTopo');
  document.getElementById('quem').textContent = resp.revisor ? ('Revisor: ' + resp.revisor) : '';
  topo.innerHTML = resp.revisor
    ? '<button class="bt azul" onclick="baixar()">Baixar respostas</button>' : '';

  if(!resp.revisor){ telaInicio(app); return; }
  if(catAtual && catAtual.indexOf('__G') === 0){
    telaGrupo(app, parseInt(catAtual.substring(3), 10)); return; }
  if(catAtual === '__PEND__'){ telaPendencias(app); return; }
  if(catAtual){ telaCategoria(app); return; }
  telaLista(app);
}

function telaLista(app){
  var c = contagem(), feitas = nRevisadas(), tot = DADOS.categorias.length;
  var h = '<div class="cx"><h2>Categorias</h2>' +
    '<div class="sub">' + feitas + ' de ' + tot + ' conferidas &middot; ' +
    nMudancas() + ' produto(s) marcados para mudar</div>' +
    '<div class="barra"><div style="width:' + (feitas/tot*100) + '%"></div></div><div class="gr">';
  DADOS.categorias.slice().sort(function(a,b){ return (c[b]||0)-(c[a]||0); }).forEach(function(k){
    h += '<div class="cat' + (resp.revisadas[k] ? ' feita' : '') + '" onclick="abrirCat(' + arg(k) + ')">' +
         '<span class="t">' + esc(k) + '</span>' +
         '<span class="q">' + (c[k]||0) + ' produtos</span>' +
         (resp.revisadas[k] ? '<span class="v">conferida</span>' : '') + '</div>';
  });
  h += '</div>';
  if(DADOS.pendentes && DADOS.pendentes.length){
    var faltam = DADOS.pendentes.filter(function(n){ return !resp.pendVistos[n]; }).length;
    h = h.replace('<div class="gr">',
      '<div class="gr"><div class="cat pend" onclick="abrirPend()">' +
      '<span class="t">&#9888; Pendencias</span>' +
      '<span class="q">' + DADOS.pendentes.length + ' produtos</span>' +
      (faltam ? '<span class="v" style="color:#a11">' + faltam + ' por olhar</span>'
              : '<span class="v">tudo visto</span>') + '</div>');
  }
  if(feitas === tot){
    h += '<div class="aviso" style="border-color:#43E97B;background:#f2fff8"><b>Terminou!</b> ' +
         'Clique em <b>Baixar respostas</b> ali em cima e mande o arquivo para o Anderson ' +
         '(<a href="https://wa.me/556536651005" target="_blank">WhatsApp</a>).</div>';
  }
  app.innerHTML = h + '</div>';
}

function abrirPend(){ catAtual = '__PEND__'; marcados = {}; window.scrollTo(0,0); render(); }

function telaPendencias(app){
  var lista = DADOS.pendentes.filter(function(n){ return porNome[n]; }).map(function(n){ return porNome[n]; });
  var idx = {};
  (DADOS.grupos || []).forEach(function(g, i){ idx[g.ALVO] = i; });
  var vistos = DADOS.pendentes.filter(function(n){ return resp.pendVistos[n]; }).length;
  var h = '<div class="cx"><h2>&#9888; Pendencias</h2>' +
    '<div class="sub">' + lista.length + ' produtos onde a IA ficou em duvida &middot; ' +

    'lado a lado, e decidir o grupo inteiro de uma vez.</div>' +
    '<div class="barra"><div style="width:' + (vistos/Math.max(lista.length,1)*100) + '%"></div></div>' +
    '<button class="bt cinza" onclick="voltar()">&larr; Voltar</button><div class="gr">';
  lista.forEach(function(p){
    var i = idx[p.NOME];
    var g = (i === undefined) ? null : DADOS.grupos[i];
    var nIrm = g ? g.IRMAOS.length : 0;
    var dif = g && g.IRMAOS.some(function(x){
      return (resp.categorias[x.NOME] || x.CATEGORIA) !== catDe(p); });
    h += '<div class="pc' + (resp.pendVistos[p.NOME] ? ' visto' : '') +
         '" onclick="' + (i === undefined ? '' : 'abrirGrupo(' + i + ')') + '">' +
         '<img loading="lazy" src="fotos/' + esc(p.FOTO) + '" alt="">' +
         '<span>' + esc(p.NOME.substring(0,40)) + '</span>' +
         '<span style="color:#0a7a45;font-weight:800">' + esc(catDe(p)) + '</span>' +
         '<span style="color:' + (dif ? '#a11' : '#8a94b3') + ';font-weight:700">' +
         (nIrm ? (nIrm + ' parecidos' + (dif ? ' &#9888;' : '')) : 'sem parecido') + '</span>' +
         (resp.pendVistos[p.NOME] ? '<span style="color:#0a7a45">conferido</span>' : '') +
         '</div>';
  });
  h += '</div>';
  h += '<div class="painel">' + vistos + ' de ' + lista.length + ' conferidos' +
       (vistos < lista.length ? '' :
        ' &mdash; <b>terminou!</b> Clique em Baixar respostas la em cima.') + '</div>';
  app.innerHTML = h + '</div>';
}

function pendOk(){
  DADOS.pendentes.forEach(function(n){ resp.pendVistos[n] = 1; });
  catAtual = ''; salvar(); window.scrollTo(0,0); render();
}

function abrirGrupo(i){ catAtual = '__G' + i; marcados = {}; window.scrollTo(0,0); render(); }

function moverGrupo(i){
  var g = DADOS.grupos[i];
  var sel = document.getElementById('destinoG'), destino = sel.value;
  if(destino === '__NOVA__'){
    var t = document.getElementById('novaG');
    destino = t ? (t.value || '').trim() : '';
    if(!destino){ alert('Digite o nome da categoria nova.'); return; }
    if(DADOS.categorias.indexOf(destino) < 0) DADOS.categorias.push(destino);
  }
  resp.categorias[g.ALVO] = destino;
  g.IRMAOS.forEach(function(x){ resp.categorias[x.NOME] = destino; });
  resp.pendVistos[g.ALVO] = 1;
  catAtual = '__PEND__'; salvar(); window.scrollTo(0,0); render();
}
function grupoOk(i){
  resp.pendVistos[DADOS.grupos[i].ALVO] = 1;
  catAtual = '__PEND__'; salvar(); window.scrollTo(0,0); render();
}

function telaGrupo(app, i){
  var g = DADOS.grupos[i];
  var cAlvo = resp.categorias[g.ALVO] || g.CATEGORIA;
  var cats = {}; cats[cAlvo] = 1;
  g.IRMAOS.forEach(function(x){ cats[resp.categorias[x.NOME] || x.CATEGORIA] = 1; });
  var nCats = Object.keys(cats).length;

  var h = '<div class="cx">' +
    '<button class="bt cinza" onclick="voltarPend()">&larr; Voltar as pendencias</button>' +
    '<h2 style="margin-top:14px">' + esc(g.ALVO) + '</h2>' +
    '<div class="sub">Este e o produto em duvida. Abaixo, os parecidos que existem no catalogo.</div>' +
    '<div class="gr"><div class="pc alvo">' +
      '<img loading="lazy" src="fotos/' + esc(g.FOTO) + '" alt="">' +
      '<span>' + esc(g.ALVO.substring(0,40)) + '</span>' +
      '<span style="color:#0a7a45;font-weight:800">' + esc(cAlvo) + '</span></div></div>';

  if(g.PORQUE){ h += '<div class="aviso" style="font-size:12px"><b>Por que ficou em duvida:</b> ' +
                     esc(g.PORQUE) + (g.ALTERNATIVA ? ' <br>A outra candidata era <b>' +
                     esc(g.ALTERNATIVA) + '</b>.' : '') + '</div>'; }

  if(g.IRMAOS.length){
    h += '<h2 style="margin-top:22px;font-size:17px">' + g.IRMAOS.length + ' produtos parecidos</h2>';
    if(nCats > 1){
      h += '<div class="sub" style="color:#a11;font-weight:700">Atencao: o grupo esta em ' +
           nCats + ' categorias diferentes.</div>';
    } else {
      h += '<div class="sub">Todos na mesma categoria.</div>';
    }
    h += '<div class="gr">';
    g.IRMAOS.forEach(function(x){
      var cx = resp.categorias[x.NOME] || x.CATEGORIA;
      h += '<div class="pc' + (cx !== cAlvo ? ' dif' : '') + '">' +
           '<img loading="lazy" src="fotos/' + esc(x.FOTO) + '" alt="">' +
           '<span>' + esc(x.NOME.substring(0,40)) + '</span>' +
           '<span style="color:' + (cx !== cAlvo ? '#a11' : '#0a7a45') + ';font-weight:800">' +
           esc(cx) + '</span></div>';
    });
    h += '</div>';
  } else {
    h += '<div class="aviso" style="margin-top:18px">Nao achei produto parecido no catalogo. ' +
         'Este item parece ser unico.</div>';
  }

  h += '<div class="painel">Mandar <b>o grupo inteiro</b> (' + (g.IRMAOS.length + 1) +
       ' produtos) para: <select id="destinoG">';
  DADOS.categorias.forEach(function(k){
    h += '<option' + (k === cAlvo ? ' selected' : '') + '>' + esc(k) + '</option>'; });
  h += '<option value="__NOVA__">+ criar categoria nova...</option></select>' +
       '<input id="novaG" placeholder="nome da categoria nova" style="display:none">' +
       '<button class="bt verde" onclick="moverGrupo(' + i + ')">Aplicar ao grupo</button>' +
       '<button class="bt claro" onclick="grupoOk(' + i + ')">Esta certo, proximo</button></div>';
  app.innerHTML = h + '</div>';
  var sel = document.getElementById('destinoG');
  if(sel) sel.onchange = function(){
    var t = document.getElementById('novaG');
    if(t) t.style.display = (sel.value === '__NOVA__') ? 'inline-block' : 'none';
  };
}

function voltarPend(){ catAtual = '__PEND__'; marcados = {}; window.scrollTo(0,0); render(); }

function telaCategoria(app){
  var lista = DADOS.produtos.filter(function(p){ return catDe(p) === catAtual; });
  var movidos = DADOS.produtos.filter(function(p){
    return p.CATEGORIA === catAtual && resp.categorias[p.NOME] &&
           resp.categorias[p.NOME] !== catAtual; });
  var h = '<div class="cx"><h2>' + esc(catAtual) + '</h2>' +
    '<div class="sub">' + lista.length + ' produtos &middot; clique nos que estao no lugar errado</div>' +
    '<button class="bt cinza" onclick="voltar()">&larr; Voltar</button><div class="gr">';
  lista.forEach(function(p){
    h += '<div class="pc' + (marcados[p.NOME] ? ' mk' : '') + '" onclick="marcar(' + arg(p.NOME) + ')">' +
         '<img loading="lazy" src="fotos/' + esc(p.FOTO) + '" alt="">' +
         '<span>' + esc(p.NOME.substring(0,44)) + '</span></div>';
  });
  h += '</div>';

  if(movidos.length){
    h += '<div class="aviso"><b>Voce tirou ' + movidos.length + ' produto(s) desta categoria:</b><br>';
    movidos.forEach(function(p){
      h += '&bull; ' + esc(p.NOME.substring(0,52)) + ' &rarr; <b>' + esc(resp.categorias[p.NOME]) +
           '</b> <button class="bt cinza" style="padding:3px 9px;font-size:11px" onclick="desfazer(' +
           arg(p.NOME) + ')">desfazer</button><br>';
    });
    h += '</div>';
  }

  var n = Object.keys(marcados).length;
  h += '<div class="painel">';
  if(n){
    h += '<b>' + n + ' marcado(s)</b> mover para: <select id="destino">';
    DADOS.categorias.forEach(function(k){
      if(k !== catAtual) h += '<option>' + esc(k) + '</option>'; });
    h += '<option value="__NOVA__">+ criar categoria nova...</option></select>' +
         '<input id="nova" placeholder="nome da categoria nova" style="display:none">' +
         '<button class="bt verde" onclick="aplicar()">Confirmar</button>' +
         '<button class="bt claro" onclick="limpar()">Limpar</button>';
  } else {
    h += 'Nenhum marcado. Se estiver tudo certo aqui: ' +
         '<button class="bt verde" onclick="catOk()">Categoria conferida</button>';
  }
  app.innerHTML = h + '</div></div>';
  var sel = document.getElementById('destino');
  if(sel) sel.onchange = function(){
    var t = document.getElementById('nova');
    if(t) t.style.display = (sel.value === '__NOVA__') ? 'inline-block' : 'none';
  };
}

window.onbeforeunload = function(){
  if(nMudancas() && !localStorage.getItem(CH + '_baixou')) return 'Voce tem alteracoes nao baixadas.';
};
render();
</script></body></html>
