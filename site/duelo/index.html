var CH = 'caborge_duelo';
var est = JSON.parse(localStorage.getItem(CH) || '{"i":0,"votos":[]}');

function salvar(){ localStorage.setItem(CH, JSON.stringify(est)); }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function votar(escolha){
  var it = ITENS[est.i];
  est.votos.push({n: it.n, escolha: escolha, v2: it.q});
  est.i++; salvar(); render();
}
function recomecar(){ est = {i:0, votos:[]}; salvar(); render(); }

function render(){
  var app = document.getElementById('app');
  document.getElementById('cont').textContent =
    est.i < ITENS.length ? (est.i + ' de ' + ITENS.length) : 'concluido';

  if(!est.i && !localStorage.getItem(CH + '_viu')){
    localStorage.setItem(CH + '_viu', '1');
    app.innerHTML = '<div class="cx"><h2>Qual categoria esta melhor?</h2>' +
      '<div class="sub">Sao ' + ITENS.length + ' produtos. Leva uns 5 minutos.</div>' +
      '<ol><li>Voce ve a foto e o nome do produto.</li>' +
      '<li>Aparecem <b>duas categorias</b>. Clique na que voce acha melhor.</li>' +
      '<li>Se nenhuma das duas servir, use o botao de baixo.</li></ol>' +
      '<div class="sub" style="margin-top:14px">As duas opcoes vem de duas versoes ' +
      'diferentes do catalogo, e a ordem esta embaralhada &mdash; nem voce nem eu sabemos ' +
      'qual e qual enquanto responde. O placar aparece so no fim.</div>' +
      '<button class="bt verde" onclick="render()">Comecar</button></div>';
    return;
  }

  if(est.i >= ITENS.length){ placar(app); return; }

  var it = ITENS[est.i];
  app.innerHTML = '<div class="cx">' +
    '<div class="barra"><div style="width:' + (est.i/ITENS.length*100) + '%"></div></div>' +
    '<img class="foto" src="../revisor-categorias/fotos/' + esc(it.f) + '" alt="">' +
    '<div class="nome">' + esc(it.n) + '</div>' +
    '<div class="cod">codigo ' + esc(it.c) + '</div>' +
    '<div class="ops">' +
      '<button class="op" onclick="votar(\'A\')">' + esc(it.a) + '</button>' +
      '<button class="op" onclick="votar(\'B\')">' + esc(it.b) + '</button>' +
    '</div>' +
    '<button class="bt nenhuma" onclick="votar(\'N\')">Nenhuma das duas serve</button></div>';
}

function placar(app){
  var v1 = 0, v2 = 0, nen = 0;
  est.votos.forEach(function(v){
    if(v.escolha === 'N'){ nen++; }
    else if(v.escolha === v.v2){ v2++; }
    else { v1++; }
  });
  var val = v1 + v2;
  var h = '<div class="cx"><h2>Resultado</h2>' +
    '<div class="sub">' + est.votos.length + ' produtos julgados</div>' +
    '<div class="linha"><span>Versao ATUAL (a que esta no site)</span><b>' + v1 + '</b></div>' +
    '<div class="linha"><span>Versao NOVA</span><b>' + v2 + '</b></div>' +
    '<div class="linha"><span>Nenhuma das duas</span><b>' + nen + '</b></div>';
  if(val){
    var pct = Math.round(v2 / val * 100);
    h += '<div class="placar"><div class="n">' + pct + '%</div>' +
         '<div class="sub">das vezes a versao NOVA ganhou</div></div>';
    h += '<div class="venc">' + (pct >= 60
      ? '<b>A versao nova ganhou com folga.</b> Pode publicar.'
      : (pct >= 45
        ? '<b>Empate tecnico.</b> A versao nova nao melhorou o suficiente para justificar a troca sozinha.'
        : '<b>A versao atual ganhou.</b> Nao publicar a nova como esta.')) +
      '<br>E ' + nen + ' produtos onde nenhuma serve &mdash; esses precisam de categoria nova ou revisao.' +
      '</div>';
  }
  h += '<button class="bt verde" onclick="baixar()">Baixar resultado e mandar para o Anderson</button>' +
       '<button class="bt" style="background:#eef1f7;color:#6b7699" onclick="recomecar()">Refazer do zero</button>';
  app.innerHTML = h + '</div>';
}

function baixar(){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(est.votos, null, 1)],
    {type:'application/json'}));
  a.download = 'duelo_resultado.json';
  a.click();
}
render();
</script></body></html>
