<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f5f7;color:#1a1d23}
.top{background:#fff;border-bottom:1px solid #e3e6ea;padding:10px 14px;position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px}
.cx{max-width:620px;margin:0 auto;padding:14px}
h2{margin:0 0 4px;font-size:20px}
.sub{color:#5b6472;font-size:14px;margin-bottom:14px}
.bt{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;background:#e9ecf1;color:#1a1d23}
.bt.azul{background:#2f6feb;color:#fff}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.cat b{display:block;font-size:14px;margin-bottom:3px}.cat span{color:#5b6472;font-size:12px}
.cat.pronta{border-color:#0a7a45;background:#f2fbf6}.cat.alerta{border-color:#e8a33d;background:#fff7e6;grid-column:1/-1}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:14px;padding:14px}
.foto{width:100%;height:220px;object-fit:contain;background:#fff;border:1px solid #e3e6ea;border-radius:8px}
.cod{display:inline-block;background:#1a1d23;color:#fff;font-weight:700;border-radius:8px;padding:4px 10px;font-size:15px;margin:10px 0 4px}
.nome{font-size:16px;font-weight:600}
.rot{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin:12px 0 4px;color:#5b6472}
.atual{background:#fdf2f2;border:1px solid #f3c7c7;border-radius:8px;padding:10px;font-size:14px}
.atual mark{background:#f8b4b4;padding:0 2px;border-radius:3px}
textarea{width:100%;min-height:150px;border:1px solid #9cc3a8;background:#f2fbf6;border-radius:8px;padding:10px;font:14px/1.45 inherit}
.mudou{font-size:13px;color:#5b6472;margin-top:6px}
.info{background:#fff7e6;border:1px solid #ffe0a3;border-radius:8px;padding:10px;font-size:14px;margin-top:10px}
.duplo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tres{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.gg{width:100%;padding:15px 0;font-size:15px;font-weight:700;border-radius:12px;border:0;color:#fff;cursor:pointer;background:#5b6472}
.gg.usar{background:#0a7a45}.gg.sel{outline:3px solid #1a1d23}
.barra{height:6px;background:#e3e6ea;border-radius:3px;overflow:hidden;margin:10px 0 4px}.barra i{display:block;height:100%;background:#2f6feb}
.linha{display:flex;justify-content:space-between;color:#5b6472;font-size:13px}
.rodape{display:flex;gap:10px;margin-top:14px}.rodape .bt{flex:1}
input{width:100%;padding:12px;border:1px solid #d5dae1;border-radius:10px;font-size:16px}
</style>

var DADOS = {"itens":[{"K":"5c26c2138ae8","T":"D","C":"000326","N":"CHUVEIRO FRIO 8 COM HASTE TIGRE","F":"000326.webp","G":"Hidraulica e Conexoes","A":"Indicação de Uso: Chuveiro para água fria, instalação em banheiros e áreas de serviço. Material e Resistência: Construído em material plástico resistente com haste metálica. Vantagem Prática: Oferece vazão controlada de água fria com fácil instalação e manutenção.","X":"haste metálica","B":"Indicação de Uso: Chuveiro para água fria, instalação em banheiros e áreas de serviço. Material e Resistência: Construído em material plástico resistente, incluindo a haste. Vantagem Prática: Oferece vazão controlada de água fria com fácil instalação e manutenção.","M":"A foto mostra haste de plástico branca, não metálica, então o trecho foi corrigido."},{"K":"58a7e0bcd437","T":"D","C":"001593","N":"REGISTRO TRI-P S1000 (G) 1.1/2 MGA","F":"001593.webp","G":"Hidraulica e Conexoes","A":"Registro de esfera com passagem reduzida, corpo em bronze, conexões BSP com alavanca de acionamento. Indicado para controle de fluxo em instalações hidráulicas e pneumáticas. Vedação de qualidade industrial com funcionamento simples e confiável.","X":"corpo em bronze","B":"Registro de esfera com passagem reduzida, corpo metálico prateado, conexões BSP com alavanca de acionamento. Indicado para controle de fluxo em instalações hidráulicas e pneumáticas. Vedação de qualidade industrial com funcionamento simples e confiável.","M":"Corrigido 'corpo em bronze' para 'corpo metálico prateado', pois a foto mostra acabamento prateado e não há certeza de que seja bronze (que tem cor dourada/acobreada)."},{"K":"b14cc6c8b390","T":"D","C":"001626","N":"GRELHA QUADRADA BRANCA 100 KRONA","F":"001626.webp","G":"Hidraulica e Conexoes","A":"Indicação de Uso: Grelha para ventilação e circulação de ar em ambientes internos e externos. Material e Resistência: Construída em material plástico na cor branca, resistente ao uso contínuo. Vantagem Prática: Formato quadrado facilita instalação e se adapta a diversos tipos de dutos e aberturas de ventilação.","X":"Grelha para ventilação e circulação de ar em ambientes internos e externos... se adapta a diversos tipos de dutos e aberturas de ventilação","B":"Indicação de Uso: Grelha para cobrir ralos de piso, permitindo o escoamento da água em ambientes internos e externos. Material e Resistência: Construída em material plástico na cor branca, resistente ao uso contínuo. Vantagem Prática: Formato quadrado facilita instalação e se adapta a diversos tipos de ralos e aberturas de escoamento.","M":"A descrição dizia que era grelha de ventilação para dutos, mas a foto mostra grelha de ralo de piso para escoamento de água."},{"K":"aa9b0c5f9039","T":"D","C":"001696","N":"REGISTRO TRI-P S1000 (D) 3/4 MGA","F":"001696.webp","G":"Hidraulica e Conexoes","A":"Registro de esfera com passagem reduzida, acionamento por alavanca. Indicação de Uso: Controle e bloqueio de fluxo em instalações hidráulicas e sanitárias. Material e Resistência: Corpo em bronze, esfera e haste em aço inoxidável, vedação de qualidade. Vantagem Prática: Fechamento rápido e seguro com vedação confiável.","X":"Corpo em bronze","B":"Registro de esfera com passagem reduzida, acionamento por alavanca. Indicação de Uso: Controle e bloqueio de fluxo em instalações hidráulicas e sanitárias. Material e Resistência: Corpo em aço inoxidável, esfera e haste em aço inoxidável, vedação de qualidade. Vantagem Prática: Fechamento rápido e seguro com vedação confiável.","M":"Corpo em bronze foi corrigido para corpo em aço inoxidável, conforme mostra a foto."},{"K":"817be0c3ddc9","T":"D","C":"001738","N":"REGISTRO TRI-P S1000 (E) 1 MGA","F":"001738.webp","G":"Hidraulica e Conexoes","A":"Registro de esfera tripartido com passagem reduzida, acionamento por alavanca. Estrutura robusta com parafusos de fixação e guias de apoio que aumentam a resistência e eliminam empenamento das tampas. Indicado para controle de fluxo em instalações hidráulicas e pneumáticas. Conexões BSP em bronze ou ferro fundido.","X":"Conexões BSP em bronze ou ferro fundido","B":"Registro de esfera tripartido com passagem reduzida, acionamento por alavanca. Estrutura robusta com parafusos de fixação e guias de apoio que aumentam a resistência e eliminam empenamento das tampas. Indicado para controle de fluxo em instalações hidráulicas e pneumáticas. Conexões BSP em aço inox.","M":"O material das conexões, antes 'bronze ou ferro fundido', foi corrigido para 'aço inox' conforme mostrado na foto."},{"K":"1637cf6375ad","T":"D","C":"001853","N":"TORN BICA MOVEL PAREDE 1/2 BRANCA PLUS 2750 HERC","F":"001853.webp","G":"Hidraulica e Conexoes","A":"Torneira de parede para água fria com conexão 1/2 polegada. Possui bica móvel que permite direcionamento do jato de água. Acionamento por volante. Indicado para cozinhas e áreas de serviço. Fabricado em ABS com sistema de fechamento rápido.","X":"Acionamento por volante","B":"Torneira de parede para água fria com conexão 1/2 polegada. Possui bica móvel que permite direcionamento do jato de água. Acionamento por alavanca. Indicado para cozinhas e áreas de serviço. Fabricado em ABS com sistema de fechamento rápido.","M":"O acionamento estava descrito como volante, mas a foto mostra acionamento por alavanca, corrigido no texto."},{"K":"79cc01a6cbe8","T":"D","C":"002012","N":"TORN FILTRO MANUAL BRANCA PRANCA 1104 5/8 HERC","F":"002012.webp","G":"Hidraulica e Conexoes","A":"Torneira com filtro manual integrado, cor branca. Dispositivo de filtragem acoplado permite controle manual do fluxo de água. Indicado para cozinhas e áreas de serviço. Material em metal resistente à corrosão. Rosca fêmea padrão para instalação em tubulações convencionais.","X":"Material em metal resistente à corrosão. Rosca fêmea padrão","B":"Torneira com filtro manual integrado, cor branca. Dispositivo de filtragem acoplado permite controle manual do fluxo de água. Indicado para cozinhas e áreas de serviço. Material em plástico resistente. Rosca macho padrão para instalação em tubulações convencionais.","M":"Trocado 'metal resistente à corrosão' por 'plástico resistente' e 'rosca fêmea' por 'rosca macho', conforme mostrado na foto."},{"K":"9e2b414caa11","T":"D","C":"002082","N":"BUCHA REDUCAO ROSCA (M) 2X1.1/2 KRONA","F":"002082.webp","G":"Hidraulica e Conexoes","A":"Indicação de Uso: Conexão e redução de tubulações hidráulicas e de água, permitindo acoplar tubos de diferentes diâmetros.\nMaterial e Resistência: Construída em bronze, oferece resistência à corrosão.\nVantagem Prática: Facilita adaptações em sistemas de encanamento e hidráulica, reduzindo necessidade de adaptadores adicionais.","X":"Construída em bronze, oferece resistência à corrosão.","B":"Indicação de Uso: Conexão e redução de tubulações hidráulicas e de água, permitindo acoplar tubos de diferentes diâmetros. Material e Resistência: Construída em PVC, oferece resistência à corrosão. Vantagem Prática: Facilita adaptações em sistemas de encanamento e hidráulica, reduzindo necessidade de adaptadores adicionais.","M":"O material estava descrito como bronze, mas a foto mostra uma bucha de redução em PVC branco."},{"K":"ee3c409537c2","T":"D","C":"002083","N":"BUCHA REDUCAO SOLDAVEL CURTA 025X20MM TIGRE","F":"002083.webp","G":"Hidraulica e Conexoes","A":"Indicação de Uso: Conexão de tubulações em sistemas hidráulicos e de irrigação, unindo tubos de diferentes diâmetros. / Material e Resistência: Fabricada em cobre ou latão com revestimento, resistente à pressão e corrosão. / Vantagem Prática: Instalação por solda oferece fixação permanente e confiável em tubulações.","X":"Fabricada em cobre ou latão com revestimento","B":"Indicação de Uso: Conexão de tubulações em sistemas hidráulicos e de irrigação, unindo tubos de diferentes diâmetros. / Material e Resistência: Fabricada em PVC marrom, resistente à pressão e corrosão. / Vantagem Prática: Instalação por solda oferece fixação permanente e confiável em tubulações.","M":"Trocou 'cobre ou latão com revestimento' por 'PVC marrom', conforme mostrado na foto."},{"K":"05035037b3fa","T":"D","C":"002134","N":"COLAR TOMADA (B) 60X3/4 KRONA","F":"002134.webp","G":"Hidraulica e Conexoes","A":"Indicação de Uso: Abraçadeira de PVC para fixação e organização de eletrodutos em instalações elétricas residenciais e comerciais. Material e Resistência: Fabricado em PVC resistente, adequado para ambientes internos e externos. Vantagem Prática: Proporciona fixação segura e organização de condutos elétricos em paredes e estruturas.","X":"Abraçadeira de PVC para fixação e organização de eletrodutos... Proporciona fixação segura e organização de condutos elétricos em paredes e estruturas","B":"Indicação de Uso: Colar de derivação em PVC com saída roscada de 3/4\", usado para conectar tomadas ou ramais a uma tubulação de 60mm já instalada. Material e Resistência: Fabricado em PVC resistente, adequado para ambientes internos e externos. Vantagem Prática: Proporciona conexão segura de derivações sem necessidade de cortar a tubulação principal.","M":"O produto não é abraçadeira para fixar eletrodutos em paredes, e sim colar de derivação com saída roscada para conectar ramais a uma tubulação já instalada."},{"K":"a28f4af65458","T":"D","C":"002139","N":"CURVA 090 ROSCA (B) 3/4 KRONA","F":"002139.webp","G":"Hidraulica e Conexoes","A":"Indicação de Uso: Conexão e redirecionamento de fluxo em instalações hidráulicas e pneumáticas com ângulo de 90 graus. Material e Resistência: Construído em latão, adequado para sistemas de água e ar comprimido. Vantagem Prática: Rosca fêmea em ambas as extremidades para acoplamento direto em tubulações e componentes.","X":"Construído em latão... Rosca fêmea em ambas as extremidades","B":"Indicação de Uso: Conexão e redirecionamento de fluxo em instalações hidráulicas e pneumáticas com ângulo de 90 graus. Material e Resistência: Construído em PVC, adequado para sistemas de água e ar comprimido. Vantagem Prática: Rosca macho em ambas as extremidades para acoplamento direto em tubulações e componentes.","M":"Trocado material de latão para PVC e rosca fêmea para rosca macho, conforme mostrado na foto."},{"K":"9ebcd1322fc3","T":"D","C":"002141","N":"CURVA 090 ROSCA (D) 1.1/4 KRONA","F":"002141.webp","G":"Hidraulica e Conexoes","A":"Curva 90 graus com rosca interna. Componente hidráulico ou de encanamento utilizado para mudança de direção de fluxo em tubulações. Indicado para sistemas de água, ar comprimido e aplicações hidráulicas que demandem conexão em ângulo reto.","X":"Curva 90 graus com rosca interna","B":"Curva 90 graus com rosca externa (macho). Componente hidráulico ou de encanamento utilizado para mudança de direção de fluxo em tubulações. Indicado para sistemas de água, ar comprimido e aplicações hidráulicas que demandem conexão em ângulo reto.","M":"A descrição dizia rosca interna, mas a foto mostra rosca externa (macho) nas duas pontas."},{"K":"7185d14190a7","T":"D","C":"002165","N":"JOELHO POLIETILENO INTERNO (C 1 AKATO","F":"002165.webp","G":"Hidraulica e Conexoes","A":"Indicação de Uso: Conexão e mudança de direção em 90° para tubulações de água fria em polietileno. Material e Resistência: Polietileno de alta resistência, resistente à corrosão e deterioração, garantindo durabilidade. Vantagem Prática: Encaixe liso nas extremidades, compatível com tubos de polietileno, proporcionando conexões seguras e sem vazamentos.","X":"Encaixe liso nas extremidades, compatível com tubos de polietileno","B":"Indicação de Uso: Conexão e mudança de direção em 90° para tubulações de água fria em polietileno. Material e Resistência: Polietileno de alta resistência, resistente à corrosão e deterioração, garantindo durabilidade. Vantagem Prática: Encaixe com rosca interna de um lado e ponta espigão serrilhada para mangueira do outro, proporcionando conexões seguras e sem vazamentos.","M":"O texto dizia 'encaixe liso nas extremidades, compatível com tubos de polietileno', mas a foto mostra rosca interna de um lado e ponta espigão serrilhada para mangueira do outro."},{"K":"ec946551ad7f","T":"D","C":"002167","N":"JOELHO POLIETILENO INTERNO (E) 1.1/2 AKATO","F":"002167.webp","G":"Hidraulica e Conexoes","A":"Indicação de Uso: Instalações hidráulicas e de irrigação, conexão de tubulações em mudanças de direção.\nMaterial e Resistência: Polietileno, resistente a corrosão e variações de temperatura.\nVantagem Prática: Leve e fácil de instalar, não requer soldagem ou rosca.","X":"não requer soldagem ou rosca","B":"Indicação de Uso: Instalações hidráulicas e de irrigação, conexão de tubulações em mudanças de direção. Material e Resistência: Polietileno, resistente a corrosão e variações de temperatura. Vantagem Prática: Leve e fácil de instalar, com rosca interna de um lado e encaixe espiral do outro, não requer soldagem.","M":"O trecho 'não requer soldagem ou rosca' foi corrigido para indicar que a peça tem rosca interna de um lado e encaixe espiral do outro, sem soldagem."},{"K":"d43ee04d5028","T":"D","C":"002176","N":"JOELHO 090 ROSCA (A) 1/2 KRONA","F":"002176.webp","G":"Hidraulica e Conexoes","A":"Indicação de Uso: Para sistemas hidráulicos e pneumáticos, proporcionando mudanças de direção em tubulações e mangueiras de alta pressão. Material e Resistência: Fabricado em metal com tratamento de proteção, resistente a pressões elevadas conforme aplicação industrial. Vantagem Prática: Conexão roscável que permite fácil instalação, desmontagem e manutenção em sistemas de potência.","X":"Fabricado em metal com tratamento de proteção, resistente a pressões elevadas conforme aplicação industrial","B":"Indicação de Uso: Para sistemas hidráulicos, proporcionando mudanças de direção em tubulações. Material e Resistência: Fabricado em PVC rígido, resistente conforme aplicação em instalações hidráulicas. Vantagem Prática: Conexão roscável que permite fácil instalação, desmontagem e manutenção no sistema.","M":"Trocado 'metal, alta pressão industrial, pneumático' por 'PVC rígido, uso hidráulico', po function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  var a = esc(atual), t = esc(trecho);
  if(t && a.indexOf(t) >= 0) return a.replace(t, '<mark>'+t+'</mark>');
  return a;
}

function voltar(){ grupo = null; window.scrollTo(0,0); render(); }
function baixar(){
  var c = {}; for(var k in resp.r){ c[resp.r[k].v] = (c[resp.r[k].v]||0)+1; }
  var out = {vendedor: resp.vendedor, rodada: 'descricoes', data: new Date().toISOString().slice(0,16).replace('T',' '),
             total: Object.keys(resp.r).length, contagem: c, respostas: resp.r};
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
  a.download = 'descricao_'+(resp.vendedor||'x').replace(/[^A-Za-z0-9]/g,'_')+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
render();
</script>
