var CH = 'caborge_conferencia_completa_v1';

function salvar(){ localStorage.setItem(CH, JSON.stringify(resp)); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function doGrupo(g){ return DADOS.itens.filter(function(p){ return p.V === g; }); }
function feitos(g){ return doGrupo(g).filter(function(p){ return resp.r[p.K]; }).length; }
function baixar(){
  var u = 0, m = 0; for(var k in resp.r){ if(resp.r[k]==='USAR') u++; else m++; }
  var out = { vendedor: resp.vendedor||'', rodada:'conferencia erp', data:new Date().toISOString().slice(0,16).replace('T',' '),
              total: u+m, usar_a_nova: u, manter_a_do_erp: m, respostas: resp.r };
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));
  a.download = 'completa_' + (resp.vendedor||'x').replace(/[^A-Za-z0-9]/g,'_') + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  localStorage.setItem(CH+'_baixou','1');
}
function render(){
  var app = document.getElementById('app');

  if(!grupoAtual){ telaGrupos(app); return; }

}
function setNome(){ var v=document.getElementById('nm').value.trim(); if(!v) return; resp.vendedor=v; salvar(); render(); }
function telaGrupos(app){
  var tot = DADOS.itens.length, ok = Object.keys(resp.r).length;

    var n = doGrupo(g.V).length, f = feitos(g.V); if(!n) return;

  });
  h += '</div>';
  if(ok) h += '<div class="ok">Ja tem resposta para '+ok+'. Clique em <b>Baixar respostas</b> quando quiser mandar.</div>';
  app.innerHTML = h + '</div>';
}
function abrir(g){ grupoAtual=g; var l=doGrupo(g); i=0; for(var k=0;k<l.length;k++){ if(!resp.r[l[k].K]){ i=k; break; } } window.scrollTo(0,0); render(); }
function telaItem(app){
  var l = doGrupo(grupoAtual);
  if(i >= l.length){ app.innerHTML = '<div class="cx"><h2>Terminou este grupo</h2><div class="ok">'+l.length+' pares conferidos.</div><div class="rodape"><button class="bt" onclick="voltar()">Outro grupo</button><button class="bt azul" onclick="baixar()">Baixar respostas</button></div></div>'; return; }

  var txt = '<b>'+esc(p.T==='PRODUTO_DIFERENTE'?'Produto DIFERENTE':'Nao deu para dizer')+'</b>' + (p.C!==''&&p.C!==undefined?' · certeza '+p.C:'') +

}
var ROT = {}; DADOS.grupos.forEach(function(g){ ROT[g.V]=g.R; });
function marcar(v){ var l=doGrupo(grupoAtual); resp.r[l[i].K]=v; salvar(); i++; window.scrollTo(0,0); render(); }

function voltar(){ grupoAtual=null; window.scrollTo(0,0); render(); }
