*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;

.top{background:#fff;border-bottom:1px solid #e3e6ea;padding:10px 14px;position:sticky;

.hoje{margin-bottom:12px}

.rot.velha{background:#8a93a0}

.par{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.op{min-width:0;cursor:pointer;border:3px solid transparent;border-radius:10px;
    padding:1px;background:#fff}
.op.sel{border-color:#0a7a45;background:#f2fbf6}
.op img{width:100%;height:200px;object-fit:contain;background:#fff;
        border:1px solid #e3e6ea;border-top:0;border-radius:0 0 8px 8px}
.op.uma{grid-column:1 / -1}
.op.uma img{height:250px}
.cod{display:inline-block;background:#1a1d23;color:#fff;font-weight:700;

.nome{font-size:16px;font-weight:600;line-height:1.3;margin-bottom:2px;word-break:break-word}
.cat-do-item{color:#5b6472;font-size:13px}
.pergunta{margin-top:12px;font-size:15px;font-weight:600}
.dica{color:#5b6472;font-size:13px;margin-top:2px}
.reaberto{background:#fff7e6;border:1px solid #ffe0a3;border-radius:8px;
          padding:8px 10px;font-size:13px;margin-top:12px;color:#7a5b12}
.duplo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.gg{width:100%;padding:17px 0;font-size:16px;font-weight:700;
    border-radius:14px;border:0;color:#fff;cursor:pointer;background:#c0392b}
.gg.manter{background:#5b6472}
.gg:active{transform:scale(.99)}
.barra{height:6px;background:#e3e6ea;border-radius:3px;overflow:hidden;margin:10px 0 4px}
.barra i{display:block;height:100%;background:#2f6feb}
.linha{display:flex;justify-content:space-between;color:#5b6472;font-size:13px}
.ok{background:#f2fbf6;border:1px solid #b7e4c9;border-radius:10px;padding:12px;
    font-size:14px;margin-top:14px}
input{width:100%;padding:12px;border:1px solid #d5dae1;border-radius:10px;font-size:16px}
.rodape{display:flex;gap:10px;margin-top:14px}
.rodape .bt{flex:1}
.mini{font-size:13px;color:#5b6472}

var CH = 'caborge_fotos_novas_v1';

if(!resp.r) resp.r = {};
if(!resp.limpos) resp.limpos = {};
var catAtual = null, i = 0;

// Produtos que o vendedor reprovou vendo UMA opcao so, e que ganharam uma
// segunda depois. A resposta dele foi honesta para o que estava na tela, mas
// incompleta — entao ela e apagada UMA VEZ para o item voltar a aparecer.
// O registro de quem ja foi limpo evita apagar de novo uma reprovacao que ele
// deu ja vendo as duas: essa vale e tem que ficar de pe.
(function reabrir(){
  var n = 0;
  (DADOS.rever || []).forEach(function(nome){
    if(!resp.limpos[nome] && resp.r[nome] === 'NAO'){
      delete resp.r[nome];
      resp.limpos[nome] = 1;
      n++;
    } else if(!resp.limpos[nome]){
      resp.limpos[nome] = 1;
    }
  });
  if(n) salvar();
})();

function salvar(){ localStorage.setItem(CH, JSON.stringify(resp)); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function daCat(c){ return DADOS.produtos.filter(function(p){ return p.C === c; }); }
function feitos(c){ return daCat(c).filter(function(p){ return resp.r[p.N]; }).length; }

function baixar(){
  var a_ = 0, b_ = 0, n_ = 0, m_ = 0;
  for(var k in resp.r){
    if(resp.r[k] === 'A') a_++;
    else if(resp.r[k] === 'B') b_++;
    else if(resp.r[k] === 'MANTER') m_++;
    else n_++;
  }
  var out = { vendedor: resp.vendedor || '', rodada: 'fotos novas - duas opcoes',
              data: new Date().toISOString().slice(0,16).replace('T',' '),
              total_respondidas: a_ + b_ + n_ + m_,
              escolheu_A: a_, escolheu_B: b_, nenhuma_serve: n_,
              manteve_a_de_hoje: m_,
              respostas: resp.r };
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type:'application/json'}));
  a.download = 'novafoto_' + (resp.vendedor || 'vendedor').replace(/[^A-Za-z0-9]/g,'_') + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  localStorage.setItem(CH + '_baixou', '1');
}

  var app = document.getElementById('app');

  });
  h += '</div>';
  if(ok) h += '<div class="ok">Ja tem resposta para ' + ok + ' fotos. ' +
              'Clique em <b>Baixar respostas</b> la em cima quando quiser mandar.</div>';
  app.innerHTML = h + '</div>';
}

function abrir(c){
  catAtual = c;
  var lista = daCat(c);
  i = 0;
  for(var k = 0; k < lista.length; k++){ if(!resp.r[lista[k].N]){ i = k; break; } }
  window.scrollTo(0,0); render();
}

function opcao(p, letra, arquivo, uma){
  var sel = resp.r[p.N] === letra ? ' sel' : '';
  return '<div class="op' + (uma ? ' uma' : '') + sel + '" onclick="marcar(\'' + letra + '\')">' +
    '<div class="rot prop">' + (uma ? 'Unica opcao' : 'Opcao ' + letra) + '</div>' +
    '<img src="' + DADOS.pasta_nova + arquivo + '" alt="" loading="eager"></div>';
}

function telaItem(app){
  var lista = daCat(catAtual);
  if(i >= lista.length){
    app.innerHTML = '<div class="cx"><h2>' + esc(catAtual) + ' — terminou</h2>' +
      '<div class="ok">Voce conferiu as ' + lista.length + ' fotos desta categoria.</div>' +
      '<div class="rodape"><button class="bt" onclick="voltar()">Escolher outra</button>' +
      '<button class="bt azul" onclick="baixar()">Baixar respostas</button></div></div>';
    return;
  }
  var p = lista[i], f = feitos(catAtual), duas = !!p.G;
  var reaberto = (DADOS.rever || []).indexOf(p.N) >= 0;
  var ops = duas ? (opcao(p, 'A', p.F, false) + opcao(p, 'B', p.G, false))
                 : opcao(p, 'A', p.F, true);
  var m = resp.r[p.N];
  app.innerHTML = '<div class="cx">' +
    '<div class="linha"><span>' + esc(catAtual) + '</span>' +
    '<span>' + (i+1) + ' de ' + lista.length + '</span></div>' +
    '<div class="barra"><i style="width:' + (f*100/lista.length) + '%"></i></div>' +
    '<div class="card">' +
    '<div class="hoje"><div class="rot velha">Foto de hoje</div>' +
      '<img class="fhoje" src="' + DADOS.pasta_velha + p.V + '" alt="" loading="eager"></div>' +
    '<div class="par">' + ops + '</div>' +
    '<div class="cod">' + esc(p.K) + '</div>' +
    '<div class="nome">' + esc(p.N) + '</div>' +
    '<div class="cat-do-item">' + esc(p.C) + '</div>' +
    (reaberto ? '<div class="reaberto">Voce ja tinha visto este, mas so com ' +
       'UMA opcao. Agora tem duas.</div>' : '') +
    '<div class="pergunta">Toque na foto que deve entrar no lugar</div>' +
    '<div class="dica">' + (duas ? 'Se as duas servirem, escolha a melhor. Se a de hoje ja estiver boa, use Manter.'
                                 : 'So achamos uma opcao para este.') + '</div>' +
    '<div class="duplo">' +
      '<button class="gg manter" onclick="marcar(\'MANTER\')">Manter a de hoje' +
        (m === 'MANTER' ? ' ✓' : '') + '</button>' +
      '<button class="gg" onclick="marcar(\'NAO\')">Nenhuma serve' +
        (m === 'NAO' ? ' ✓' : '') + '</button>' +
    '</div>' +
    '</div>' +
    '<div class="rodape">' +
      '<button class="bt" onclick="anterior()">&larr; Voltar</button>' +
      '<button class="bt" onclick="pular()">Pular</button>' +
      '<button class="bt" onclick="voltar()">Categorias</button>' +
    '</div></div>';
}

function marcar(v){
  var lista = daCat(catAtual);
  resp.r[lista[i].N] = v;
  salvar();
  i++; window.scrollTo(0,0); render();
}
function pular(){ i++; window.scrollTo(0,0); render(); }
function anterior(){ if(i > 0) i--; window.scrollTo(0,0); render(); }
function voltar(){ catAtual = null; window.scrollTo(0,0); render(); }

window.onbeforeunload = function(){
  if(Object.keys(resp.r).length && !localStorage.getItem(CH + '_baixou'))
    return 'Voce tem respostas nao baixadas.';
};
render();
</script>
